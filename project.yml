name: OverlapWindow
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  OverlapWindow:
    type: application
    platform: iOS
    sources: [App, Sources/OverlapCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.talk2rakesh.overlapwindow
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  OverlapWindowUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: OverlapWindow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.talk2rakesh.overlapwindow.uitests
schemes:
  OverlapWindow:
    build:
      targets:
        OverlapWindow: all
    test:
      targets: [OverlapWindowUITests]
